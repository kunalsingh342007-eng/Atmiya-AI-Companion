<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ātmiya (आत्मीय) — Real-Time AI Human Companion</title>
    <meta name="description" content="A personal, multilingual AI companion with real-time voice, empathetic conversation, and an expressive animated avatar." />
    <meta property="og:title" content="Ātmiya (आत्मीय) — Real-Time AI Human Companion" />
    <meta property="og:description" content="A personal, multilingual AI companion with real-time voice, empathetic conversation, and an expressive animated avatar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Rozha+One&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('atmiya_companion_settings_v1');
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = parsed && parsed.darkNavyDefaultMigrated ? parsed.theme : 'dark';
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'auto' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
